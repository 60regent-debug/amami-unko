name = "amami-unko-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
VAPID_SUBJECT = "https://60regent-debug.github.io/amami-unko/"

# 届け先と前回の状態を保存
[[kv_namespaces]]
binding = "SUBS"
id = "a0d29e91ec3c486eba010189bfada586"

# /ping（利用者数）の回数制限：同じ回線から1分に5回まで
[[ratelimits]]
name = "PING_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 利用者数（運航情報のKVとは別にして、乱用されても運航情報の更新に響かないようにする）
[[d1_databases]]
binding = "STATS"
database_name = "amami-unko-stats"
database_id = "4793b34a-4ac9-4f12-9a39-680ab947564a"
