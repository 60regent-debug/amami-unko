<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奄美 運航情報</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="奄美大島の船と飛行機の運航状況を、港ごとにひと目で。">
<meta name="theme-color" content="#082a47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="奄美運航">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sea-0: #061f36; --sea-1: #0a3558; --sea-2: #11568a; --sea-3: #3b8fc7;
    --doro: #3a2a20; --doro-2: #6e5646; --sand: #f4efe6; --paper: #fffcf6;
    --link: #0d4b7a; --ink: #1c140e; --ink-2: #3f3229; --ink-3: #5a4b40; --rule: #e7ded2;
    --ok: #1f6a42;   --ok-bg: #dcefe3;
    --warn: #864c00; --warn-bg: #fae7c4;
    --stop: #9c221b; --stop-bg: #f6d9d5;
    --none: #4f4137; --none-bg: #e9e0d4;
    --serif: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --sans: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sand: #120d0a; --paper: #1d1612; --ink: #faf5ee; --ink-2: #e2d6ca; --ink-3: #cbbcae; --rule: #33281f;
      --doro: #d9c4ae; --doro-2: #bfa891;
      --ok: #7fd2a4;   --ok-bg: #173126;
      --warn: #f0bb62; --warn-bg: #362812;
      --stop: #ff948a; --stop-bg: #3b1c18;
      --none: #d8cabc; --none-bg: #2a211b;
      --link: #8cc8f0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--sand); color: var(--ink);
    font-family: var(--sans); font-size: 20px; font-weight: 500; line-height: 1.65;
    font-feature-settings: "palt"; letter-spacing: .02em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ── ヒーロー ── */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background:
      radial-gradient(120% 80% at 85% 0%, rgba(120,190,235,.35) 0%, transparent 55%),
      linear-gradient(170deg, var(--sea-0) 0%, var(--sea-1) 45%, var(--sea-2) 85%, var(--sea-3) 100%);
    padding: calc(env(safe-area-inset-top) + 28px) 24px 76px;
  }
  .hero .inner { position: relative; z-index: 2; max-width: 560px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: .22em;
    opacity: .85; text-transform: uppercase;
  }
  .hero h1 {
    font-family: var(--serif); font-weight: 900; font-size: 38px; line-height: 1.25;
    letter-spacing: .12em; margin: 10px 0 0;
  }
  .hero .lead { font-size: 18px; font-weight: 500; opacity: .95; margin-top: 8px; letter-spacing: .08em; }
  .stamp {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
    font-size: 18px; font-weight: 700; letter-spacing: .04em;
  }
  .stamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8fe3b4; box-shadow: 0 0 0 4px rgba(143,227,180,.18); }
  .stamp.stale::before { background: #f0bb62; box-shadow: 0 0 0 4px rgba(240,187,98,.18); }
  .hero svg { position: absolute; left: 0; width: 100%; pointer-events: none; }
  .hero .isle { bottom: 40px; height: 70px; opacity: .14; }
  .hero .wave1 { bottom: 6px; height: 40px; opacity: .18; }
  .hero .wave2 { bottom: -1px; height: 36px; }
  .hero .wave2 path { fill: var(--sand); }

  /* ── 港の切り替え ── */
  .switch {
    position: sticky; top: 0; z-index: 10;
    background: var(--sand);
    padding: 4px 16px 10px;
  }
  .seg {
    max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 4px;
    box-shadow: 0 6px 20px -10px rgba(36,26,19,.35);
  }
  .seg button {
    font: inherit; font-weight: 700; font-size: 19px; letter-spacing: .06em;
    border: 0; background: transparent; color: var(--ink-2);
    padding: 13px 0; border-radius: 10px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .seg button[aria-pressed="true"] { background: var(--doro); color: var(--sand); }

  /* ── 乗り物の切り替え（フェリー／飛行機） ── */
  .mode {
    max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .mode button {
    font: inherit; font-weight: 900; font-size: 22px; letter-spacing: .06em; line-height: 1.2;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 2px solid var(--rule); background: var(--paper); color: var(--ink-2);
    padding: 14px 6px; border-radius: 14px; cursor: pointer; position: relative;
    box-shadow: 0 6px 20px -12px rgba(36,26,19,.4);
  }
  .mode button[aria-pressed="true"] { background: var(--sea-1); border-color: var(--sea-1); color: #fff; }
  .mode .badge {
    position: absolute; top: -9px; right: -4px; font-size: 14px; font-weight: 700; letter-spacing: 0;
    padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--stop); border: 2px solid var(--sand);
  }
  .mode .badge.warn { background: var(--warn); }
  .sub { max-width: 528px; margin: 10px auto 0; }
  .seg.small button { font-size: 17px; padding: 9px 0; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  [hidden] { display: none !important; }

  /* ── 天気 ── */
  .wx {
    max-width: 528px; margin: -44px auto 14px; position: relative; z-index: 3;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 18px;
    padding: 16px 18px 14px; box-shadow: 0 14px 34px -18px rgba(8,42,71,.55);
  }
  .wx-wrap { padding: 0 16px; }
  .wx-top { display: flex; align-items: center; gap: 14px; }
  .wx-icon { font-size: 44px; line-height: 1; }
  .wx-temp { font-size: 40px; font-weight: 900; letter-spacing: 0; line-height: 1; }
  .wx-temp small { font-size: 17px; font-weight: 700; color: var(--ink-3); margin-left: 2px; }
  .wx-sky { font-size: 18px; font-weight: 700; line-height: 1.4; }
  .wx-sky small { display: block; font-size: 15px; font-weight: 500; color: var(--ink-3); }
  .wx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .wx-cell { background: var(--sand); border-radius: 12px; padding: 8px 10px; }
  .wx-cell span { display: block; font-size: 14px; font-weight: 700; color: var(--ink-3); letter-spacing: .08em; }
  .wx-cell b { display: block; font-size: 18px; font-weight: 900; line-height: 1.35; }
  .wx-cell b small { font-size: 14px; font-weight: 700; }
  .wx-cell.big-wave b { color: var(--stop); }
  .wx-wave { margin-top: 8px; font-size: 16px; color: var(--ink-2); }
  .wx-next { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 16px; color: var(--ink-2); }
  .wx-src { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
  .wx-src a { color: var(--link); white-space: nowrap; }

  main { max-width: 560px; margin: 0 auto; padding: 6px 16px 40px; }

  /* ── セクション見出し ── */
  .sec { margin-top: 26px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px 12px; border-bottom: 1px solid var(--rule); }
  .sec-head h2 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 29px; letter-spacing: .1em; }
  .sec-head h2 small { font-family: var(--sans); font-weight: 700; font-size: 14px; letter-spacing: .18em; color: var(--ink-3); margin-left: 10px; }
  .tally { display: flex; gap: 6px; font-size: 17px; font-weight: 700; }
  .tally span { padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .tally .t-stop { color: var(--stop); background: var(--stop-bg); }
  .tally .t-warn { color: var(--warn); background: var(--warn-bg); }
  .tally .t-ok { color: var(--ok); background: var(--ok-bg); }

  /* ── 便のリスト ── */
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; align-items: start;
    padding: 18px 4px; border-bottom: 1px solid var(--rule);
  }
  .mark {
    grid-row: span 2; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; color: var(--c); background: var(--bg);
  }
  .mark svg { width: 28px; height: 28px; }
  .ship { font-weight: 900; font-size: 24px; letter-spacing: .04em; line-height: 1.35; }
  .ship small { display: block; font-weight: 500; font-size: 17px; color: var(--ink-3); letter-spacing: .04em; margin-top: 2px; }
  .label { font-weight: 700; font-size: 18px; color: var(--c); background: var(--bg); white-space: nowrap; padding: 3px 10px; border-radius: 8px; letter-spacing: .04em; justify-self: start; }
  .route { grid-column: 2; font-size: 17px; font-weight: 500; color: var(--ink-3); letter-spacing: .02em; margin-top: 4px; }
  .route b { color: var(--ink); font-weight: 700; }
  .note-line { grid-column: 2; font-size: 19px; font-weight: 500; color: var(--ink); line-height: 1.6; white-space: pre-line; }
  .actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .btn {
    font: inherit; font-size: 17px; font-weight: 700; letter-spacing: .02em; line-height: 1.2;
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px;
    text-decoration: none; cursor: pointer; border: 1.5px solid var(--rule); background: var(--paper); color: var(--link);
  }
  .btn:active { opacity: .7; }
  .bell[aria-pressed="true"] { background: var(--doro); border-color: var(--doro); color: var(--sand); }
  .upd { grid-column: 2; font-size: 15px; color: var(--ink-3); margin-top: 2px; }
  .notify-box { margin-top: 14px; padding: 18px; border-radius: 14px; border: 1px solid var(--rule); background: var(--paper); font-size: 18px; color: var(--ink-2); }
  .notify-box b { color: var(--ink); }
  .notify-box .btn { margin-top: 12px; }
  .notify-box ol { margin: 8px 0 0; padding-left: 1.4em; }
  .s-ok   { --c: var(--ok);   --bg: var(--ok-bg); }
  .s-warn { --c: var(--warn); --bg: var(--warn-bg); }
  .s-stop { --c: var(--stop); --bg: var(--stop-bg); }
  .s-none { --c: var(--none); --bg: var(--none-bg); }

  .flight { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--rule); }
  .flight .when { font-size: 24px; font-weight: 900; letter-spacing: .02em; }
  .flight .when s { font-size: 17px; font-weight: 500; color: var(--ink-3); margin-right: 6px; }
  .flight .where { font-size: 20px; font-weight: 700; margin-left: 6px; }
  .flight .who { font-size: 16px; color: var(--ink-3); }
  .flight .label { justify-self: end; }
  .flight .bell { grid-column: 2; justify-self: end; font-size: 15px; padding: 7px 10px; }
  .flight.done { opacity: .55; }
  .more-btn { margin-top: 12px; width: 100%; justify-content: center; }
  .soon {
    margin-top: 14px; padding: 18px; border-radius: 14px; border: 1px dashed var(--rule);
    color: var(--ink-2); font-size: 18px; background: var(--paper);
  }
  .soon b { display: block; font-family: var(--serif); font-size: 20px; color: var(--ink); letter-spacing: .1em; margin-bottom: 2px; }

  .error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; color: var(--stop); background: var(--stop-bg); font-size: 18px; font-weight: 700; }
  footer { max-width: 560px; margin: 0 auto; padding: 8px 20px calc(env(safe-area-inset-bottom) + 36px); font-size: 16px; color: var(--ink-3); line-height: 1.8; letter-spacing: .02em; }
  footer .brand { font-family: var(--serif); font-size: 18px; color: var(--ink-2); letter-spacing: .2em; margin-bottom: 6px; }
</style>
</head>
<body>
<header class="hero">
  <div class="inner">
    <div class="eyebrow">Amami Oshima · Ferry &amp; Flight</div>
    <h1>奄美 運航情報</h1>
    <div class="lead">船と飛行機の欠航を、ひと目で。</div>
    <div class="stamp" id="stamp">読み込み中…</div>
  </div>
  <!-- 装飾：島影と波（特定の地形・文様の再現ではない） -->
  <svg class="isle" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="M190 70 C215 52 232 40 252 44 C268 26 292 14 314 24 C330 16 348 22 360 34 C378 34 392 48 400 56 L400 70 Z" fill="#fff"/>
  </svg>
  <svg class="wave1" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 34 C70 18 130 18 200 30 C270 42 330 42 400 28 L400 64 L0 64 Z" fill="#fff"/>
  </svg>
  <svg class="wave2" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 C80 14 140 14 210 26 C280 38 340 36 400 24 L400 48 L0 48 Z"/>
  </svg>
</header>

<div class="wx-wrap"><section class="wx" id="wx" aria-label="奄美の天気"><div class="wx-sky">天気を読み込み中…</div></section></div>

<div class="switch">
  <div class="mode" role="group" aria-label="乗り物を選ぶ">
    <button data-mode="ferry" aria-pressed="true">🚢 フェリー<span class="badge" id="badge-ferry" hidden></span></button>
    <button data-mode="flight" aria-pressed="false">✈️ 飛行機<span class="badge" id="badge-flight" hidden></span></button>
  </div>
  <div class="sub" id="sub-ferry">
    <div class="seg small" role="group" aria-label="港を選ぶ">
      <button data-port="名瀬港" aria-pressed="true">名瀬港</button>
      <button data-port="古仁屋港" aria-pressed="false">古仁屋港</button>
      <button data-port="all" aria-pressed="false">すべて</button>
    </div>
  </div>
  <div class="sub" id="sub-flight" hidden>
    <div class="seg small two" role="group" aria-label="出発・到着を選ぶ">
      <button data-kind="departures" aria-pressed="true">出発便</button>
      <button data-kind="arrivals" aria-pressed="false">到着便</button>
    </div>
  </div>
</div>

<main>
  <div id="ships"></div>

  <section class="sec" id="flight-sec" hidden>
    <div class="sec-head"><h2>奄美空港<small>AIRPORT</small></h2><div class="tally" id="fl-tally"></div></div>
    <div id="flights"><div class="soon">読み込み中…</div></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>お知らせ<small>NOTIFY</small></h2></div>
    <div class="notify-box" id="notify-box">読み込み中…</div>
  </section>

  <div id="errors"></div>
</main>

<footer>
  <div class="brand">奄美 運航情報</div>
  各社の公式ページをもとに、運航状況の区分だけを表示しています。寄港地の変更や時刻など詳しい内容は、各便の「公式ページ」から必ずご確認ください。試作版のため、表示が遅れたり誤ったりする場合があります。
</footer>

<script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const PORTS = [["名瀬港", "NAZE"], ["古仁屋港", "KONIYA"]];
  const CLS = { normal: "s-ok", caution: "s-warn", cancel: "s-stop", unknown: "s-none" };
  const ICON = {
    normal:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    caution: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v8"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg>',
    cancel:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
    unknown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>',
  };
  // ── 通知 ──
  const PUSH_API = "https://amami-unko-push.60regent.workers.dev";
  const keyOf = it => (it.id || "").startsWith("marix") ? "marix" : it.id;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  let targets = [];
  try { targets = JSON.parse(localStorage.getItem("targets") || "[]"); } catch (e) {}
  let swReg = null;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {});

  function bellButton(k) {
    const on = targets.includes(k);
    return `<button class="btn bell" data-key="${esc(k)}" aria-pressed="${on}">${on ? "🔔 通知中" : "🔕 通知する"}</button>`;
  }

  const b64ToBytes = b => {
    const s = atob(b.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b.length + 3) % 4));
    return Uint8Array.from(s, c => c.charCodeAt(0));
  };

  async function getSubscription(create) {
    const reg = swReg || await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub && create) {
      const { publicKey } = await (await fetch(PUSH_API + "/vapid")).json();
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    }
    return sub;
  }

  const post = (path, body) => fetch(PUSH_API + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  }).then(r => r.json());

  async function toggle(k) {
    if (!pushOK || (isIOS && !standalone)) { notifyBox("guide"); document.getElementById("notify-box").scrollIntoView({ behavior: "smooth" }); return; }
    if (Notification.permission !== "granted") {
      const p = await Notification.requestPermission();
      if (p !== "granted") { notifyBox("denied"); return; }
    }
    const next = targets.includes(k) ? targets.filter(t => t !== k) : [...targets, k];
    try {
      const sub = await getSubscription(next.length > 0);
      if (sub) await post("/subscribe", { subscription: sub.toJSON(), targets: next });
      targets = next;
      try { localStorage.setItem("targets", JSON.stringify(targets)); } catch (e) {}
      render(); notifyBox();
    } catch (e) {
      notifyBox("error");
    }
  }

  async function sendTest() {
    try {
      const sub = await getSubscription(false);
      if (!sub) { notifyBox(); return; }
      const r = await post("/test", { subscription: sub.toJSON() });
      document.getElementById("test-result").textContent = r.ok ? "送りました。数秒で届きます。" : "送れませんでした。";
    } catch (e) { document.getElementById("test-result").textContent = "送れませんでした。"; }
  }

  function notifyBox(mode) {
    const el = document.getElementById("notify-box");
    if (mode === "guide" || (!mode && (!pushOK || (isIOS && !standalone)))) {
      el.innerHTML = `<b>通知を受け取るには、先にホーム画面に追加してください。</b>
        <ol><li>Safariの下にある共有ボタン（□に↑）を押す</li><li>「ホーム画面に追加」を押す</li><li>ホーム画面のアイコンから開き直し、便の「🔕 通知する」を押す</li></ol>`;
    } else if (mode === "denied" || (pushOK && Notification.permission === "denied")) {
      el.innerHTML = `<b>通知が許可されていません。</b><br>iPhoneの「設定」→「通知」→「奄美運航」で通知をオンにしてください。`;
    } else if (mode === "error") {
      el.innerHTML = `<b>うまく設定できませんでした。</b><br>電波の良い場所で、もう一度お試しください。`;
    } else if (targets.length) {
      el.innerHTML = `<b>🔔 ${targets.length}件の便を通知中です。</b><br>運航状況が変わると、この端末にお知らせが届きます。やめるときは、便の「🔔 通知中」を押してください。
        <div><button class="btn" id="test-btn">テスト通知を送る</button> <span id="test-result"></span></div>`;
      document.getElementById("test-btn").onclick = sendTest;
    } else {
      el.innerHTML = `<b>乗る便の「🔕 通知する」を押してください。</b><br>欠航や条件付など、運航状況が変わったときにこの端末へお知らせが届きます。アカウント登録は要りません。`;
    }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest(".bell");
    if (b) toggle(b.dataset.key);
  });

  let data = null, current = "名瀬港", mode = "ferry";
  try { current = localStorage.getItem("port") || current; mode = localStorage.getItem("mode") || mode; } catch (e) {}

  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch (e) { return "#"; } };

  function item(it, port) {
    const name = it.ship || it.operator;
    const sub = it.ship ? it.operator : "";
    const key = port === "all" ? null : port.replace("港", "");
    const route = key ? esc(it.route).split(key).join(`<b>${key}</b>`) : esc(it.route);
    return `
      <li><div class="item ${CLS[it.level] || "s-none"}">
        <span class="mark" aria-hidden="true">${ICON[it.level] || ICON.unknown}</span>
        <span class="label">${esc(it.label)}</span>
        <span class="ship">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
        <span class="route">${route}</span>
        ${it.headline ? `<span class="note-line">${esc(it.headline)}</span>` : ""}
        ${it.updated ? `<span class="upd">${esc(it.updated)} 更新</span>` : ""}
        <span class="actions">
          ${it.level !== "unknown" || it.id === "setouchi" ? bellButton(keyOf(it)) : ""}
          <a class="btn" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">公式ページ →</a>
        </span>
      </div></li>`;
  }

  function section([port, en], items) {
    const n = l => items.filter(i => i.level === l).length;
    const t = [
      n("cancel") ? `<span class="t-stop">欠航 ${n("cancel")}</span>` : "",
      n("caution") ? `<span class="t-warn">注意 ${n("caution")}</span>` : "",
      n("normal") ? `<span class="t-ok">通常 ${n("normal")}</span>` : "",
    ].join("");
    return `<section class="sec">
      <div class="sec-head"><h2>${port}<small>${en}</small></h2><div class="tally">${t}</div></div>
      <ul class="list">${items.map(i => item(i, port)).join("")}</ul>
    </section>`;
  }

  // ── 天気 ──
  const SKY = { sun: "☀️", cloud: "☁️", rain: "☔", snow: "❄️" };
  function renderWeather(w) {
    const el = document.getElementById("wx");
    const t = w && w.days && w.days[0], now = w && w.now;
    if (!t && !now) { el.hidden = true; return; }
    const temp = now && now.temp != null ? now.temp.toFixed(1) : (t && t.max != null ? t.max : "–");
    const range = t ? [t.max != null ? `最高 ${t.max}℃` : "", t.min != null ? `最低 ${t.min}℃` : ""].filter(Boolean).join(" / ") : "";
    const wind = now && now.wind != null ? `${now.windDir && now.windDir !== "静穏" ? esc(now.windDir) + " " : ""}${now.wind}<small>m</small>` : (t ? esc(t.wind) : "–");
    const waveNum = t ? parseFloat((t.wave.match(/[\d.]+(?=m)/g) || []).pop() || "0") : 0;
    const rain = now && now.rain1h ? `${now.rain1h}<small>mm/時</small>` : (t && t.pop != null ? `${t.pop}<small>%</small>` : "–");
    const tm = w.days && w.days[1];
    el.innerHTML = `
      <div class="wx-top">
        <span class="wx-icon" aria-hidden="true">${SKY[t ? t.sky : "cloud"]}</span>
        <span class="wx-temp">${temp}<small>℃</small></span>
        <span class="wx-sky">${t ? esc(t.weather) : ""}<small>${range ? range + "（名瀬）" : "名瀬"}</small></span>
      </div>
      <div class="wx-grid">
        <div class="wx-cell${waveNum >= 3 ? " big-wave" : ""}"><span>波</span><b>${t ? esc(t.wave.replace(/（.*）/, "")) : "–"}</b></div>
        <div class="wx-cell"><span>風</span><b>${wind}</b></div>
        <div class="wx-cell"><span>${now && now.rain1h ? "雨（1時間）" : "降水確率"}</span><b>${rain}</b></div>
      </div>
      ${t && /うねり/.test(t.wave) ? `<div class="wx-wave">🌊 うねりがあります</div>` : ""}
      ${tm ? `<div class="wx-next">明日　${SKY[tm.sky]} ${esc(tm.weather)}　波 ${esc(tm.wave.replace(/（.*）/, ""))}${tm.max != null ? `　${tm.max}℃` : ""}</div>` : ""}
      <div class="wx-src">気象庁（奄美地方の予報${now ? `・名瀬 ${esc(now.time)} 観測` : ""}）<a href="${esc(safeUrl(w.url))}" target="_blank" rel="noopener">詳しく →</a></div>`;
  }

  let flKind = "departures", showDone = false;
  try { flKind = localStorage.getItem("flKind") || flKind; } catch (e) {}

  function flightRow(f) {
    const done = /済み/.test(f.status);
    const dir = flKind === "arrivals" ? `${esc(f.place)}から` : `${esc(f.place)}行き`;
    const when = f.changed ? `<s>${esc(f.time)}</s>${esc(f.changed)}` : esc(f.time);
    return `<div class="flight ${CLS[f.level] || "s-none"}${done ? " done" : ""}">
      <div><span class="when">${when}</span><span class="where">${dir}</span><div class="who">${esc(f.airline)}　${esc(f.flight)}便</div></div>
      <span class="label">${esc(f.status)}</span>
      ${done ? "" : `<span></span>${bellButton(f.id)}`}
    </div>`;
  }

  function renderFlights() {
    const el = document.getElementById("flights");
    const fl = data && data.flights;
    if (!fl || (!fl.arrivals.length && !fl.departures.length)) {
      el.innerHTML = `<div class="soon"><b>表示できる便がありません</b><a class="btn" href="https://amami-airport.co.jp/flight/today" target="_blank" rel="noopener">奄美空港の公式ページ →</a></div>`;
      return;
    }
    const list = fl[flKind] || [];
    const isDone = f => /済み/.test(f.status);
    const rest = list.filter(f => !isDone(f)), done = list.filter(isDone);
    const n = l => rest.filter(f => f.level === l).length;
    document.getElementById("fl-tally").innerHTML =
      `${n("cancel") ? `<span class="t-stop">欠航 ${n("cancel")}</span>` : ""}${n("caution") ? `<span class="t-warn">変更 ${n("caution")}</span>` : ""}`;
    el.innerHTML = `
      ${rest.length ? rest.map(flightRow).join("") : `<div class="soon">今日のこれからの便はありません</div>`}
      ${done.length ? (showDone ? done.map(flightRow).join("") : "") +
        `<button class="btn more-btn" id="toggle-done">${showDone ? "終わった便をかくす" : `終わった便も見る（${done.length}便）`}</button>` : ""}
      <a class="btn more-btn" href="${esc(safeUrl(fl.url))}" target="_blank" rel="noopener">奄美空港の公式ページ →</a>`;
    const t = document.getElementById("toggle-done");
    if (t) t.onclick = () => { showDone = !showDone; renderFlights(); };
  }

  function badge(id, list) {
    const el = document.getElementById(id);
    const stop = list.filter(x => x.level === "cancel").length, warn = list.filter(x => x.level === "caution").length;
    el.hidden = !(stop || warn);
    el.className = stop ? "badge" : "badge warn";
    el.textContent = stop ? `欠航${stop}` : `注意${warn}`;
  }

  function render() {
    document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    document.querySelectorAll("[data-port]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.port === current)));
    document.querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === flKind)));
    document.getElementById("sub-ferry").hidden = mode !== "ferry";
    document.getElementById("sub-flight").hidden = mode !== "flight";
    document.getElementById("ships").hidden = mode !== "ferry";
    document.getElementById("flight-sec").hidden = mode !== "flight";
    if (!data) return;
    const shown = current === "all" ? PORTS : PORTS.filter(p => p[0] === current);
    document.getElementById("ships").innerHTML =
      shown.map(p => section(p, data.items.filter(i => (i.ports || []).includes(p[0])))).join("");
    renderFlights();
    badge("badge-ferry", data.items);
    const fl = data.flights || {};
    badge("badge-flight", [...(fl.departures || []), ...(fl.arrivals || [])].filter(f => !/済み/.test(f.status)));
  }

  const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode; remember("mode", mode); render(); window.scrollTo({ top: 0 });
  }));
  document.querySelectorAll("[data-port]").forEach(b => b.addEventListener("click", () => {
    current = b.dataset.port; remember("port", current); render();
  }));
  document.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
    flKind = b.dataset.kind; showDone = false; remember("flKind", flKind); render();
  }));
  render();
  notifyBox();

  // 最新の情報は Cloudflare（15分おきに更新）から。読めないときは公開時点の status.json を使う
  fetch(PUSH_API + "/status.json")
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => (d.items && d.items.length ? d : Promise.reject()))
    .catch(() => fetch("status.json?" + Date.now()).then(r => r.json()))
    .then(d => {
      data = d;
      const stamp = document.getElementById("stamp");
      stamp.textContent = d.generated_at.replace(/^\d{4}-(\d{2})-(\d{2})/, (_, m, dd) => `${+m}月${+dd}日`) + " 時点の情報";
      const age = (Date.now() - new Date(d.generated_at.replace(" ", "T") + ":00+09:00")) / 60000;
      if (age > 60) stamp.classList.add("stale");
      render();
      renderWeather(d.weather);
      if (d.errors && d.errors.length)
        document.getElementById("errors").innerHTML = `<div class="error">一部の会社の情報を取得できませんでした。公式ページをご確認ください。</div>`;
    })
    .catch(() => {
      document.getElementById("stamp").textContent = "情報を取得できませんでした";
      document.getElementById("ships").innerHTML = `<div class="error">運航情報を読み込めませんでした。時間をおいて開き直してください。</div>`;
    });
</script>
</body>
</html>
