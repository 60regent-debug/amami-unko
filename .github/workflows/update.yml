name: 運航情報の更新と公開

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分おき（GitHubの混雑で数分遅れることがある）
  workflow_dispatch:          # 手動実行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 各社の運航状況を読み取る
        run: python3 fetch_status.py
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp index.html status.json robots.txt manifest.json apple-touch-icon.png icon-192.png icon-512.png sw.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
